<!-- PlanEasy brand for the Markdown pages that GitHub Pages renders with its default theme.
     The SmartUrbanity HTML pages have no front matter, so Jekyll copies them unchanged. -->
<link rel="icon" href="{{ '/assets/PlanEasy/planeasy_mark.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/PlanEasy/planeasy_favicon_32.png' | relative_url }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ '/assets/PlanEasy/planeasy_apple_touch_icon_180.png' | relative_url }}" sizes="180x180">
<meta name="theme-color" content="#087083">
<style>
  :root {
    --pe-teal: #087083;
    --pe-teal-dark: #065A69;
    --pe-teal-light: #22B3C4;
    --pe-magenta: #D6206B;
    --pe-yellow: #FFDA28;
    --pe-ink: #0B1214;
    --pe-paper: #F3F7F8;
  }
  /* Teal links: 5.74:1 on white, 7.85:1 for the darker hover (WCAG AA). */
  a { color: var(--pe-teal); }
  a:hover, a:focus { color: var(--pe-teal-dark); }
  a:focus-visible { outline: 2px solid var(--pe-magenta); outline-offset: 2px; }
</style>

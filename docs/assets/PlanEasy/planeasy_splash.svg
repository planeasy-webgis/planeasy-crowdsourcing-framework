<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="PlanEasy">
  <!-- PlanEasy splash: the mark above the name. Transparent background, favicon colours, system
       fonts only; the "planeasy" splash variant draws the background. In a dark colour scheme
       the teal lightens and the wordmark turns white, like the mark on dark browser chrome. -->
  <style>
    .t{stroke:#087083}.n{fill:#0B1214}.e{fill:#087083}
    @media (prefers-color-scheme: dark){.t{stroke:#22B3C4}.n{fill:#FFFFFF}.e{fill:#22B3C4}}
  </style>
  <g transform="translate(172 8) scale(2.1)">
    <circle class="t" cx="34" cy="25" r="15" fill="none" stroke-width="9"/>
    <path class="t" d="M19 25 V56" stroke-width="9" stroke-linecap="round"/>
    <circle cx="34" cy="25" r="5.5" fill="#D6206B"/>
    <circle cx="52" cy="50" r="4.5" fill="#FFDA28"/>
  </g>
  <text class="n" x="240" y="214" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">plan<tspan class="e" font-weight="400">easy</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PlanEasy">
  <!-- PlanEasy mark "p come punto": a lowercase p whose bowl is a place (magenta), followed by a
       yellow full stop. Colours of the historical favicon; lighter teal on dark browser chrome. -->
  <style>.t{stroke:#087083}@media (prefers-color-scheme: dark){.t{stroke:#22B3C4}}</style>
  <circle class="t" cx="34" cy="25" r="15" fill="none" stroke-width="9"/>
  <path class="t" d="M19 25 V56" stroke-width="9" stroke-linecap="round"/>
  <circle cx="34" cy="25" r="5.5" fill="#D6206B"/>
  <circle cx="52" cy="50" r="4.5" fill="#FFDA28"/>
</svg>
